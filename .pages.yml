media:
  # 클라이언트가 업로드한 이미지가 저장되는 경로 (git 레포 내부)
  input: src/assets/gallery/uploads
  output: /src/assets/gallery/uploads

content:
  - name: gallery
    label: 갤러리 이미지
    path: src/data/gallery
    type: collection
    format: json
    view:
      primary: caption
      fields: [caption, sections, order]
    fields:
      - name: image
        label: 이미지 파일
        type: image
        required: true

      - name: sections
        label: 공간 구분
        type: select
        required: true
        options:
          values:
            - name: home
              label: 주거 공간
            - name: work
              label: 사무 공간
            - name: kitchen
              label: 주방
            - name: door
              label: 방문·문
            - name: window
              label: 샷시·창호
            - name: furniture
              label: 가구
            - name: entrance
              label: 현관
          multiple: true
          min: 1

      - name: caption
        label: 자재명·설명
        type: string

      - name: order
        label: 표시 순서 (작을수록 앞에 표시)
        type: number
        default: 99000
