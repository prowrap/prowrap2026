media:
  input: src/assets/gallery/uploads
  output: /src/assets/gallery/uploads

content:
  - name: gallery
    label: 갤러리 이미지
    path: src/data/gallery
    type: collection
    format: json
    filename: "gallery-{year}{month}{day}-{hour}{minute}{second}.json"
    view:
      primary: caption
      fields: [caption, sections, order]
    fields:
      - name: image
        label: 이미지 파일
        type: image
        required: true

      - name: sections
        label: 공간 구분
        type: select
        required: true
        options:
          multiple: true
          values:
            - value: home
              label: 주거 공간
            - value: commercial
              label: 상업 공간
            - value: set
              label: 드라마·영화 세트
            - value: sample
              label: 필름 샘플
            - value: detail
              label: 디테일

      - name: caption
        label: 자재명·설명
        type: string

      - name: order
        label: 표시 순서 (작을수록 앞에 표시)
        type: number
        default: 99000